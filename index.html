<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css"/>
    <script src="index.js"></script>
    <title>Milk Calculator</title>
</head>
<body>
<div id="inputDiv">
    <p class="inInputDiv">Enter Weight (lbs)</p>

    <input type="number" id="weightInput" class="inInputDiv" min="0" max="300" step="1">

    <button onclick="myFunc()" class="inInputDiv">
        Calculate
    </button>
</div>
<p class="textDiv" id="result">What percent of you is milk?</p>
<p class="textDiv" id="countdown">Countdown</p>
</body>

</html>
