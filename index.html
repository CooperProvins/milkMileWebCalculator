<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css"/>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="index.js"></script>
    <title>Milk Mile</title>
</head>
<body>
<div id="inputDiv">
    <p class="inInputDiv">Enter Weight (lbs)</p>

    <input type="number" id="weightInput" class="inInputDiv" min="0" max="300" step="1">

    <button onclick="myFunc()" class="inInputDiv">
        Calculate
    </button>
</div>
<p class="textDiv" id="result" hidden></p>
<div class="textDiv" id="statsDiv">
    <b>How much milk?</b>
    <div id="statsGrid">
        <p>Volume</p>
            <p>48 oz</p>
        <p>Weight</p>
            <p>3.25 lbs</p>
        <p>Protein</p>
            <p>43.7 g</p>
        <p>Calories</p>
            <p>864 cal</p>
        </div>
</div>
<p class="textDiv" id="countdown"></p>
</body>

</html>
