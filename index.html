<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Browser</title>
</head>
  <body>
	<p>Enter Weight (lbs)</p>

  <input type="number" id="weightInput"></input>
    
  <button onclick="myFunc()">
    Calculate

    }
  </script>

</body>

</html>
