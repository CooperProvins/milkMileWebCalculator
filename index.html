<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css"/>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="index.js" defer></script>
    <title>Milk Mile</title>
</head>
<body>
    <main>
        <div class="flexMember">
            <div id="inputDiv" class="bigDivEnergy">
                <p class="inInputDiv">Enter your weight (lbs)</p>

                <input type="number" id="weightInput" class="inInputDiv" min="0" max="300" step="1">

                <button onclick="myFunc()" class="inInputDiv">
                    Calculate
                </button>
            </div>
            <p class="bigDivEnergy" id="result" hidden></p>
        </div>
        <div class="flexMember">
            <div class="bigDivEnergy" id="statsDiv">
                <b>How much milk?</b>
                <div id="statsGrid">
                    <p>Volume</p>
                        <p>48 oz</p>
                    <p>Calories</p>
                        <p>864 cal</p>
                    <p>Protein</p>
                        <p>43.7 g</p>
                    <p>Weight</p>
                        <p>3.25 lbs</p>
                </div>
            </div>
        </div>
        <div class="flexMember">
            <div class="bigDivEnergy" id="milkMap">
                <h1>Milk Map</h1>
                <img src="MilkMap.png">
            </div>
        </div>
    </main>
    <p class="bigDivEnergy" id="countdown">#d ##h ##m ##s</p>
</body>
</html>
